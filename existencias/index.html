<body class="h-full bg-app-bg dark:bg-darkapp-bg text-app-title dark:text-darkapp-title flex flex-col font-sans overflow-hidden antialiased transition-colors duration-200">

    <main class="flex-1 overflow-y-auto p-4 md:p-6 max-w-5xl mx-auto w-full space-y-6 flex flex-col justify-start">
        
        <!-- Sección Actualizar archivo -->

            <label for="excelFile" class="py-2 px-4 bg-app-accent hover:bg-app-active text-app-brand rounded-lg transition-all font-semibold text-xs flex items-center shadow-sm gap-1.5 cursor-pointer shrink-0">

                            <span class="text-[10px] font-semibold uppercase tracking-wider text-app-sub block mb-1">Sub Sub Familia</span>

            <!-- Columna Derecha: INVENTARIO (El apartado más importante) -->

    <!-- Modal de Confirmación para Eliminar Base de Datos -->
    <div id="confirmDeleteModal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white/80 dark:bg-slate-900/85 backdrop-blur-xl border border-white/20 dark:border-slate-700/30 rounded-2xl p-6 w-full max-w-sm shadow-xl text-center space-y-5">
            <div class="text-rose-500 flex justify-center mx-auto">

            </div>
            <p class="text-xs font-semibold text-app-title dark:text-darkapp-title leading-relaxed">
                Esta acción no se puede deshacer. ¿Desea continuar?
            </p>
            <div class="flex gap-2 w-full pt-2">
                <button onclick="cerrarConfirmacionEliminar()" class="flex-1 py-2 text-app-sub hover:text-app-title dark:text-darkapp-sub dark:hover:text-darkapp-title hover:bg-app-bg/50 dark:hover:bg-slate-800/50 font-semibold rounded-xl text-xs transition-colors">
                    Cancelar
                </button>
                <button onclick="eliminarBaseDatos()" class="flex-1 py-2 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl text-xs shadow-sm transition-colors">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Alerta Genérico (Éxito/Eliminación/Errores) -->
    <div id="alertModal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white/80 dark:bg-slate-900/85 backdrop-blur-xl border border-white/20 dark:border-slate-700/30 rounded-2xl p-6 w-full max-w-sm shadow-xl text-center space-y-5">
            <div id="alertIconContainer" class="text-app-brand flex justify-center mx-auto">
                <i data-lucide="check-circle-2" id="alertIcon" class="w-8 h-8"></i>
            </div>
            <p id="alertText" class="text-xs font-semibold text-app-title dark:text-darkapp-title leading-relaxed">Mensaje</p>
            <button onclick="cerrarModalAlerta()" class="w-full py-2.5 bg-app-brand hover:bg-teal-700 text-white rounded-xl text-xs font-semibold transition-colors shadow-sm">
                Aceptar
            </button>
        </div>
    </div>

    <!-- Modal Escáner de Cámara -->
    <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-4 hidden" id="scannerModal">
      <div class="w-full max-w-md bg-black rounded-2xl overflow-hidden relative shadow-2xl">
        <div id="reader" class="w-full"></div>
      </div>
      <button type="button" class="mt-6 bg-app-card text-app-title hover:bg-app-bg font-bold px-8 py-3 rounded-full text-sm transition-colors shadow-lg" onclick="cerrarEscaner()">Cerrar Cámara</button>
    </div>

<script>
  // --- REGISTRO DEL SERVICE WORKER ---
  function initServiceWorker() {
      if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then((registration) => console.log('[PWA] SW OK en Existencias:', registration.scope))
              .catch((error) => console.error('[PWA] SW error:', error));
      }
  }

  // --- VARIABLES GLOBALES ---
  let baseDatosMatriz = [];
  let indexMap = new Map(); // Índice para búsquedas O(1)
  let html5QrCode = null;
  let audioCtx = null;

  // --- TEMA ---
  const btnThemeToggle = document.getElementById('btn-theme-toggle');
  const htmlElement = document.documentElement;
  
  function setTheme(isDark) {
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (isDark) {
          htmlElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
          if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
      } else {
          htmlElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
          if (themeMeta) themeMeta.setAttribute('content', '#F5F7FA');
      }
  }

  // --- MODALES ---
  function mostrarAlerta(mensaje, tipo = 'success') {
      document.getElementById('alertText').textContent = mensaje;
      const iconContainer = document.getElementById('alertIconContainer');
      const icon = document.getElementById('alertIcon');
      
      if (tipo === 'error') {
          iconContainer.className = "text-rose-500 flex justify-center mx-auto";
          icon.setAttribute('data-lucide', 'alert-circle');
      } else {
          iconContainer.className = "text-app-brand flex justify-center mx-auto";
          icon.setAttribute('data-lucide', 'check-circle-2');
      }
      
      document.getElementById('alertModal').classList.remove('hidden');
      lucide.createIcons();
  }

  function cerrarModalAlerta() {
      document.getElementById('alertModal').classList.add('hidden');
  }

  function mostrarConfirmacionEliminar() {
      document.getElementById('confirmDeleteModal').classList.remove('hidden');
  }

  function cerrarConfirmacionEliminar() {
      document.getElementById('confirmDeleteModal').classList.add('hidden');
  }

  // --- LÓGICA DE BASE DE DATOS ---
  function procesarYGuardarDatos(matriz, nombreArchivo) {
      baseDatosMatriz = matriz;
      indexMap.clear(); // Limpiar índice

      // Construir índice para búsquedas O(1)
      for (let i = 1; i < baseDatosMatriz.length; i++) {
          const fila = baseDatosMatriz[i];
          if (!fila) continue;
          const numArticulo = String(fila[1] || '').replace(/^'/, '').trim();
          const codBarras = String(fila[2] || '').replace(/^'/, '').trim();
          
          if (numArticulo) indexMap.set(numArticulo, fila);
          if (codBarras) indexMap.set(codBarras, fila);
      }

      try {
          localStorage.setItem('baseDatosConsultor', JSON.stringify(baseDatosMatriz));
          localStorage.setItem('nombreArchivoConsultor', nombreArchivo);
          document.getElementById('statusMemoria').textContent = removerExtension(nombreArchivo);
          document.getElementById('statusDot').classList.remove('bg-red-500');
          document.getElementById('statusDot').classList.add('bg-app-brand');
          mostrarAlerta('Base de datos cargada con éxito.', 'success');
      } catch (err) {
          console.warn("LocalStorage lleno:", err);
          document.getElementById('statusMemoria').textContent = removerExtension(nombreArchivo);
          document.getElementById('statusDot').classList.remove('bg-red-500');
          document.getElementById('statusDot').classList.add('bg-app-brand');
          mostrarAlerta("El archivo es muy grande para guardarse permanentemente. Funcionará en esta sesión.", "error");
      }
  }

  function eliminarBaseDatos() {
      cerrarConfirmacionEliminar();
      baseDatosMatriz = [];
      indexMap.clear();
      localStorage.removeItem('baseDatosConsultor');
      localStorage.removeItem('nombreArchivoConsultor');
      document.getElementById('statusMemoria').textContent = 'Sin base de datos';
      document.getElementById('statusDot').classList.remove('bg-app-brand');
      document.getElementById('statusDot').classList.add('bg-red-500');
      limpiarCampos();
      document.getElementById('excelFile').value = '';
      mostrarAlerta('Base de datos eliminada correctamente.', 'success');
  }

  function removerExtension(nombre) {
    if (!nombre) return "";
    return nombre.replace(/\.[^/.]+$/, "");
  }

  // --- BÚSQUEDA Y RENDERIZADO ---
  function ejecutarBusqueda(busqueda) {
      if (!busqueda) {
          limpiarCampos();
          return;
      }
      
      // Búsqueda instantánea usando el índice Map
      const resultado = indexMap.get(busqueda);
      
      if (resultado) {
          const numArticulo = String(resultado[1] || '').trim();
          const codBarras = String(resultado[2] || '').trim();
          const coincidioEnBarras = (codBarras === busqueda);
          
          const labelElem = document.getElementById('labelSkuOrBar');
          const valElem = document.getElementById('sku');
          
          if (coincidioEnBarras) {
              labelElem.textContent = 'SKU';
              valElem.textContent = numArticulo || '-';
          } else {
              labelElem.textContent = 'Código de barras';
              valElem.textContent = codBarras || '-';
          }
          
          document.getElementById('familia').textContent = resultado[4] || '-';
          document.getElementById('subfamilia').textContent = resultado[5] || '-';
          document.getElementById('subsubfamilia').textContent = resultado[6] || '-';
          document.getElementById('descripcion').textContent = resultado[3] || '-';
          document.getElementById('inventario').textContent = resultado[7] !== undefined ? resultado[7] : '0';
      } else {
          limpiarCampos();
      }
  }

  function limpiarCampos() {
      document.getElementById('labelSkuOrBar').textContent = 'SKU / CÓDIGO';
      document.getElementById('sku').textContent = '-';
      document.getElementById('familia').textContent = '-';
      document.getElementById('subfamilia').textContent = '-';
      document.getElementById('subsubfamilia').textContent = '-';
      document.getElementById('descripcion').textContent = '-';
      document.getElementById('inventario').textContent = '-';
  }

  // --- ESCÁNER DE CÁMARA ---
  function reproducirFeedbackEscaneo() {
    if ("vibrate" in navigator) navigator.vibrate(150);
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
  }

  function abrirEscaner() {
    const modal = document.getElementById('scannerModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13 ],
        verbose: false
      });
    }
    
    const config = { 
      fps: 25,
      qrbox: { width: 300, height: 160 },
      aspectRatio: 1.0,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      videoConstraints: {
        facingMode: "environment",
        width: { min: 640, ideal: 1280, max: 1920 },
        height: { min: 480, ideal: 720, max: 1080 },
        focusMode: "continuous"
      }
    };
    
    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        reproducirFeedbackEscaneo();
        const inputCodigo = document.getElementById('codigo');
        inputCodigo.value = decodedText.replace(/\D/g, '');
        ejecutarBusqueda(inputCodigo.value);
        cerrarEscaner();
      },
      () => {}
    ).catch(err => {
      console.error("Error al iniciar cámara:", err);
      mostrarAlerta("No se pudo acceder a la cámara.", "error");
      cerrarEscaner();
    });
  }

  function cerrarEscaner() {
    const modal = document.getElementById('scannerModal');
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }).catch(err => {
        console.error(err);
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      });
    } else {
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }
  }

  // --- INICIALIZACIÓN ---
  window.addEventListener('DOMContentLoaded', () => {
    initServiceWorker();
    setTheme(localStorage.getItem('theme') !== 'light');
    lucide.createIcons();

    btnThemeToggle.addEventListener('click', () => {
        setTheme(!htmlElement.classList.contains('dark'));
    });

    // Cargar datos guardados si existen
    const datosGuardados = localStorage.getItem('baseDatosConsultor');
    const nombreGuardado = localStorage.getItem('nombreArchivoConsultor');
    if (datosGuardados) {
      try {
        const parsed = JSON.parse(datosGuardados);
        procesarYGuardarDatos(parsed, nombreGuardado || "Archivo guardado");
      } catch (e) {
        console.error("Error al cargar la base de datos local:", e);
      }
    }
  });

  // Listener del Input de archivo
  document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    baseDatosMatriz = [];
    indexMap.clear();
    localStorage.removeItem('baseDatosConsultor');
    localStorage.removeItem('nombreArchivoConsultor');
    limpiarCampos();
    
    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheet];
      const matriz = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      
      procesarYGuardarDatos(matriz, file.name);
    };
    reader.readAsArrayBuffer(file);
  });

  // Listener del Input de búsqueda
  document.getElementById('codigo').addEventListener('input', function() {
    const valorLimpio = this.value.replace(/\D/g, '');
    if (this.value !== valorLimpio) {
      this.value = valorLimpio;
    }
    // Debounce implícito: solo busca si tiene al menos 2 caracteres
    if (this.value.trim().length > 0) {
      ejecutarBusqueda(this.value.trim());
    } else {
      limpiarCampos();
    }
  });
</script>
</body>
</html>
