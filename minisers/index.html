  <!-- JAVASCRIPT: SUPABASE, AUTH GUARD, CRUD Y NOTIFICACIONES -->
  <script>  
    // --- SUPABASE CONFIG Y CLIENTE ---
    const SUPABASE_URL = "https://mifbcyxtafeacwkzqzsq.supabase.co";  
    const SUPABASE_ANON_KEY = "sb_publishable_O6EAbkSba1NQPq08k_7bHg_PZ_x4ZU5";  

    if (!window.supabase) {
        console.error('[Supabase] SDK no disponible, redirigiendo al login.');
        window.location.replace('../index.html');
        throw new Error('Supabase SDK no disponible');
    }
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  

    // Escucha logout o expiración de token en otra pestaña
    supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') window.location.replace('../index.html');
    });

    // --- TEMA ---
    const btnThemeToggle = document.getElementById('btn-theme-toggle');  
    const htmlElement = document.documentElement;  
    function setTheme(isDark) {  
        const themeMeta = document.querySelector('meta[name="theme-color"]');  
        if (isDark) {  
            htmlElement.classList.add('dark');  
            localStorage.setItem('theme', 'dark');  
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');  
        } else {  
            htmlElement.classList.remove('dark');  
            localStorage.setItem('theme', 'light');  
            if (themeMeta) themeMeta.setAttribute('content', '#F5F7FA');  
        }  
    }  
    const savedTheme = localStorage.getItem('theme');  
    setTheme(savedTheme !== 'light');  
    btnThemeToggle.addEventListener('click', () => setTheme(!htmlElement.classList.contains('dark')));  

    // --- ESTABLECER FECHA MÁXIMA ACTUAL EN LOS INPUTS DE FECHA ---
    function inicializarFechasMaximas() {
        const hoyStr = new Date().toISOString().split('T')[0];
        document.getElementById('empNacimiento').max = hoyStr;
        document.getElementById('empIngreso').max = hoyStr;
    }

    // --- MENÚS Y DROPDOWNS ---
    function toggleToolsMenu(event) {  
        event.stopPropagation();

    // --- GESTIÓN DE FOTO (Compresión y Supabase Storage Bucket) ---
    let archivoFotoSeleccionado = null;

    function comprimirImagenFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        resolve(new File([blob], "foto_comprimida.jpg", { type: "image/jpeg" }));
                    }, 'image/jpeg', 0.75);
                };
            };
        });
    }

    async function seleccionarArchivoFoto(input) {
        if (input.files && input.files[0]) {
            archivoFotoSeleccionado = await comprimirImagenFile(input.files[0]);
            const reader = new FileReader();
            reader.onload = (e) => mostrarPreviewFoto(e.target.result);
            reader.readAsDataURL(archivoFotoSeleccionado);
        }
    }

    function mostrarPreviewFoto(url) {
        const preview = document.getElementById('imgPreview');
        const placeholder = document.getElementById('imgPlaceholder');

    }

    async function subirFotoASupabase(file, numeroEmpleado) {
        const fileExt = 'jpg';
        const fileName = `emp_${numeroEmpleado}_${Date.now()}.${fileExt}`;
        const filePath = `${fileName}`;

        const { data, error } = await supabaseClient.storage
            .from('empleados-fotos')
            .upload(filePath, file, { upsert: true });

        if (error) {
            console.error("Error al subir la imagen:", error);
            throw error;
        }

        const { data: publicURLData } = supabaseClient.storage
            .from('empleados-fotos')
            .getPublicUrl(filePath);

        return publicURLData.publicUrl;
    }

    // --- CÁLCULO DE ANTIGÜEDAD ---
    function calcularAniosAntiguedad(fechaIngreso) {
        if (!fechaIngreso) return '0 años';
        const ingreso = new Date(fechaIngreso);
        const hoy = new Date();
        let anos = hoy.getFullYear() - ingreso.getFullYear();
        const m = hoy.getMonth() - ingreso.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < ingreso.getDate())) anos--;
        const meses = (hoy.getFullYear() - ingreso.getFullYear()) * 12 + (hoy.getMonth() - ingreso.getMonth());
        if (anos < 1) return `${Math.max(0, meses)} meses`;
        return `${anos} año${anos > 1 ? 's' : ''}`;
    }

    function calcularAntiguedadPreview() {
        const val = document.getElementById('empIngreso').value;
        document.getElementById('empAntiguedadPreview').value = calcularAniosAntiguedad(val);
    }

    // --- VERIFICAR CUMPLEAÑOS Y ANIVERSARIOS HOY ---
    function evaluarAlertasYNotificaciones(empleados) {
        const hoy = new Date();
        const mesHoy = hoy.getMonth() + 1;
        const diaHoy = hoy.getDate();
        const anioActual = hoy.getFullYear();
        const listaAlertas = document.getElementById('listaAlertas');
        const seccionAlertas = document.getElementById('seccionAlertas');
        listaAlertas.innerHTML = '';
        let alertasCount = 0;

        empleados.forEach(emp => {
            if (emp.nacimiento) {
                const partesNac = emp.nacimiento.split('-');
                if (partesNac.length === 3) {
                    const mesNac = parseInt(partesNac[1], 10);
                    const diaNac = parseInt(partesNac[2], 10);
                    if (mesNac === mesHoy && diaNac === diaHoy) {
                        alertasCount++;
                        const div = document.createElement('div');
                        div.className = "flex items-center gap-2 text-app-title dark:text-darkapp-title bg-white/60 dark:bg-slate-800/60 p-2 rounded-xl border border-transparent";
                        div.innerHTML = `<i data-lucide="cake" class="w-4 h-4 text-rose-500 shrink-0"></i> <span>¡Hoy es el <strong>cumpleaños</strong> de <strong>${emp.nombre}</strong>! 🎂</span>`;
                        listaAlertas.appendChild(div);
                    }
                }
            }

            if (emp.ingreso) {
                const partesIng = emp.ingreso.split('-');
                if (partesIng.length === 3) {
                    const anioIng = parseInt(partesIng[0], 10);
                    const mesIng = parseInt(partesIng[1], 10);
                    const diaIng = parseInt(partesIng[2], 10);
                    const anosCumplidos = anioActual - anioIng;

                    if (anioIng < anioActual && mesIng === mesHoy && diaIng === diaHoy) {
                        alertasCount++;
                        const div = document.createElement('div');
                        div.className = "flex items-center gap-2 text-app-title dark:text-darkapp-title bg-white/60 dark:bg-slate-800/60 p-2 rounded-xl border border-transparent";
                        div.innerHTML = `<i data-lucide="award" class="w-4 h-4 text-amber-500 shrink-0"></i> <span>¡<strong>${emp.nombre}</strong> hoy cumple <strong>${anosCumplidos} año${anosCumplidos > 1 ? 's' : ''}</strong> en la empresa! 🏆</span>`;
                        listaAlertas.appendChild(div);
                    }
                }
            }
        });

        if (alertasCount > 0) {
            seccionAlertas.classList.remove('hidden');
            seccionAlertas.classList.add('flex');
        } else {
            seccionAlertas.classList.remove('flex');
            seccionAlertas.classList.add('hidden');
        }
        lucide.createIcons();
    }

    async function guardarEmpleado(event) {
        event.preventDefault();
        const idVal = document.getElementById('empId').value;
        const numeroIngresado = document.getElementById('empNumero').value.trim();
        const puestoSelect = document.getElementById('empPuestoSelect').value;
        const fechaNacimiento = document.getElementById('empNacimiento').value;
        const fechaIngreso = document.getElementById('empIngreso').value;

        const hoyStr = new Date().toISOString().split('T')[0];
        if (fechaNacimiento > hoyStr) {
            mostrarAlerta('La fecha de nacimiento no puede ser una fecha a futuro.', true);
            return;
        }
        if (fechaIngreso > hoyStr) {
            mostrarAlerta('La fecha de ingreso no puede ser una fecha a futuro.', true);
            return;
        }

        if (!puestoSelect) {
            mostrarAlerta('Por favor seleccione un puesto válido.', true);
            return;
        }

        const puestoFinal = puestoSelect === 'Otro' ? document.getElementById('empPuestoOtro').value.trim() : puestoSelect;

        const { data: existing, error: errCheck } = await supabaseClient
            .from('empleados')
            .select('id, numero_empleado')
            .eq('numero_empleado', numeroIngresado);

        if (!errCheck && existing) {
            const existe = existing.some(emp => !idVal || emp.id !== Number(idVal));
            if (existe) {
                mostrarAlerta('El número de empleado ingresado ya existe. Por favor valide el número de empleado.', true);
                return;
            }
        }

        let fotoUrlFinal = document.getElementById('empFotoUrl').value;
        if (archivoFotoSeleccionado) {
            try {
                fotoUrlFinal = await subirFotoASupabase(archivoFotoSeleccionado, numeroIngresado);
            } catch (err) {
                mostrarAlerta('Error al subir la imagen al bucket.', true);
                return;
            }
        }

        const empleadoObj = {
            nombre: document.getElementById('empNombre').value.trim(),
            numero_empleado: numeroIngresado,
            correo: document.getElementById('empCorreo').value.trim(),
            telefono: document.getElementById('empTelefono').value.trim(),
            nacimiento: fechaNacimiento,
            ingreso: fechaIngreso,
            puesto: puestoFinal,
            foto_url: fotoUrlFinal
        };

        let res;
        if (idVal) {
            res = await supabaseClient.from('empleados').update(empleadoObj).eq('id', Number(idVal));
        } else {
            res = await supabaseClient.from('empleados').insert([empleadoObj]);
        }

        if (res.error) {
            mostrarAlerta('Error al guardar el empleado en Supabase.', true);
        } else {
            cerrarModalEmpleado();
            cargarEmpleados();
            mostrarAlerta(idVal ? 'Empleado actualizado correctamente' : 'Empleado registrado con éxito');
        }
    }

        const numero = decodeURIComponent(numeroEnc);
        const telefono = decodeURIComponent(telefonoEnc);

        const texto = `👤 *Ficha de Miniser*\n\n` +
                      `• *Nombre completo:* ${nombre}\n` +
                      `• *Puesto:* ${puesto}\n` +
                      `• *Número de empleado:* ${numero}\n` +
                      `• *Número celular:* ${telefono}\n` +
                      `• *Correo electrónico:* ${correo}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }

            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + "Número de Empleado,Nombre Completo,Puesto,Celular,Correo Electrónico,Fecha Nacimiento,Fecha Ingreso\n";
        empleados.forEach(emp => {
            csvContent += `"${emp.numero_empleado}","${emp.nombre}","${emp.puesto}","${emp.telefono || ''}","${emp.correo || ''}","${emp.nacimiento || ''}","${emp.ingreso}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "agenda_empleados_miniser.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- REALTIME SYNC ---
    function iniciarSuscripcionRealtime() {
        supabaseClient
            .channel('cambios-empleados-miniser')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'empleados' }, () => {
                cargarEmpleados();
            })
            .subscribe();
    }

    window.addEventListener('online', () => cargarEmpleados());
    window.addEventListener('offline', () => actualizarEstadoConexionUI());

    // Inicializar al cargar la página
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace('../index.html');
                return;
            }
        } catch (e) {
            window.location.replace('../index.html');
            return;
        }

        inicializarFechasMaximas();
        await cargarEmpleados();
        iniciarSuscripcionRealtime();
        lucide.createIcons();
    });
  </script>  
</body>  
</html>
