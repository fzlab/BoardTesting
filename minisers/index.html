<!DOCTYPE html>  
<html lang="es" class="h-full">  
<head>  
  <meta charset="UTF-8">  
  <link rel="stylesheet" href="../fonts.css">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
  <title>Gestor de Minisers</title>    
  <link rel="icon" type="image/svg+xml" href="./agenda.svg">
    
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https://mifbcyxtafeacwkzqzsq.supabase.co; connect-src 'self' https://mifbcyxtafeacwkzqzsq.supabase.co wss://mifbcyxtafeacwkzqzsq.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none';">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta name="theme-color" content="#F5F7FA">  
  <meta name="apple-mobile-web-app-capable" content="yes">  
  <meta name="apple-mobile-web-app-status-bar-style" content="default">    

  <script>
      (function() {
          const SESSION_KEY = 'sb-mifbcyxtafeacwkzqzsq-auth-token';
          if (localStorage.getItem(SESSION_KEY) === null) {
              document.documentElement.style.visibility = 'hidden';
              window.location.replace('../index.html');
          }
      })();
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  
  <script src="https://cdn.tailwindcss.com"></script>  
  <script src="https://unpkg.com/lucide@1.72.0"></script>    
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  

  <script>  
    tailwind.config = {  
        darkMode: 'class',  
        theme: {  
            extend: {  
                fontFamily: { sans: ['Geist', 'sans-serif'] },  
                colors: {  
                    app: { bg: '#F5F7FA', card: '#FFFFFF', border: '#E5EAF0', title: '#172033', sub: '#64748B', brand: '#0D9488', accent: '#E6F6F4' },  
                    darkapp: { bg: '#0F172A', card: '#1E293B', border: '#334155', title: '#F8FAFC', sub: '#94A3B8' }  
                }  
            }  
        }  
    }  
  </script>    

  <style>  
      html, body { overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }  
      body { user-select: none; -webkit-user-select: none; }  
      input, select, textarea { user-select: text; -webkit-user-select: text; }  
      ::-webkit-scrollbar { width: 5px; height: 5px; }  
      ::-webkit-scrollbar-track { background: transparent; }  
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }  
      .dark ::-webkit-scrollbar-thumb { background: #334155; }  
      body, .card, input, select, button { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }  
      .glass-modal { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }  
      .dark .glass-modal { background: rgba(15, 23, 42, 0.9); }  
      .input-ghost { background-color: rgba(255, 255, 255, 0.4); border: 1px solid transparent; }
      .dark .input-ghost { background-color: rgba(30, 41, 59, 0.4); }
      .input-ghost:focus { background-color: rgba(255, 255, 255, 0.8); border-color: #0D9488; outline: none; box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2); }
      .dark .input-ghost:focus { background-color: rgba(15, 23, 42, 0.8); }
      
      .avatar-initials { text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  </style>  
</head>  
<body class="h-full bg-app-bg dark:bg-darkapp-bg text-app-title dark:text-darkapp-title flex flex-col font-sans overflow-hidden antialiased">    

  <div id="optionsBlurOverlay" onclick="closeAllMenus()" class="fixed inset-0 z-40 bg-slate-900/20 dark:bg-slate-950/40 backdrop-blur-[3px] transition-opacity duration-200 hidden"></div>    
    
  <div class="main-content flex-1 flex flex-col overflow-y-auto">  
    <header class="bg-app-bg/95 dark:bg-darkapp-bg/95 backdrop-blur-md px-4 py-3 flex items-center justify-between shrink-0 z-50 sticky top-0">  
        <div class="flex items-center space-x-3">  
          <a href="../index.html" class="p-2 text-app-sub hover:text-app-brand dark:text-darkapp-sub dark:hover:text-teal-400 rounded-lg transition-all cursor-pointer" title="Ir al Inicio">  
              <i data-lucide="house" class="w-5 h-5"></i>  
          </a>    
          <div>  
              <h1 class="font-bold text-base leading-tight">Gestor de Minisers</h1>  
              <p class="text-[11px] text-app-sub dark:text-darkapp-sub font-medium mt-0.5">T0151 - Gran Plaza Mérida</p>  
          </div>  
        </div>  
        <div class="flex items-center gap-2">  
          <button type="button" id="btn-theme-toggle" class="h-8 w-14 rounded-full bg-slate-200 dark:bg-slate-800 relative flex items-center p-1 cursor-pointer transition-colors" title="Cambiar modo">  
              <div class="absolute inset-0 flex justify-between items-center px-2 pointer-events-none">  
                  <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-500 opacity-40 dark:opacity-100"></i>  
                  <i data-lucide="moon" class="w-3.5 h-3.5 text-slate-400 dark:text-indigo-400 opacity-100 dark:opacity-40"></i>  
              </div>  
              <div class="w-6 h-6 rounded-full bg-white dark:bg-slate-900 shadow-sm flex items-center justify-center transform transition-transform translate-x-0 dark:translate-x-6 z-10">  
                  <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-500 dark:hidden"></i>  
                  <i data-lucide="moon" class="w-3.5 h-3.5 text-indigo-400 hidden dark:block"></i>  
              </div>  
          </button>  
          <div class="relative">  
            <button type="button" onclick="toggleToolsMenu(event)" class="p-2 text-app-sub hover:text-app-brand dark:text-darkapp-sub dark:hover:text-teal-400 hover:bg-app-card dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer relative z-50" title="Más opciones">  
              <i data-lucide="more-vertical" class="w-5 h-5"></i>  
            </button>  
            <div id="toolsDropdown" class="hidden absolute right-0 top-full mt-2 bg-app-card/90 dark:bg-darkapp-card/90 backdrop-blur-md min-w-[220px] shadow-lg border border-transparent rounded-xl z-50 py-1 flex flex-col gap-0.5">  
              <button type="button" onclick="exportarExcelGeneral(); closeAllMenus();" class="w-full px-4 py-2.5 text-left text-xs font-semibold text-app-title dark:text-darkapp-title hover:bg-app-bg dark:hover:bg-slate-800/50 flex items-center gap-2.5 transition-colors cursor-pointer">
                  <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500"></i> Exportar Todo a Excel
              </button>  
              <button type="button" onclick="compartirWhatsappGeneral(); closeAllMenus();" class="w-full px-4 py-2.5 text-left text-xs font-semibold text-app-title dark:text-darkapp-title hover:bg-app-bg dark:hover:bg-slate-800/50 flex items-center gap-2.5 transition-colors cursor-pointer">
                  <i data-lucide="share-2" class="w-4 h-4 text-teal-500"></i> Compartir Agenda Global (WA)
              </button>  
            </div>  
          </div>  
      </div>  
    </header>  

    <div class="px-4 md:px-6 max-w-7xl mx-auto w-full flex flex-col gap-4 py-6 flex-1">  
          
      <!-- ESTADO Y MINI DASHBOARD -->
      <div class="flex items-center justify-between flex-wrap gap-2">
          <span id="conexionStatus" class="inline-flex items-center gap-1.5 text-[11px] text-amber-500 font-semibold uppercase tracking-wider"><i class="fa-solid fa-circle-dot"></i> Conectando...</span>          
          <div class="flex items-center gap-2 text-[11px] font-semibold text-app-sub dark:text-darkapp-sub">
              <span class="flex items-center gap-1 px-2 py-1"><i data-lucide="users" class="w-3.5 h-3.5 text-app-brand"></i> <span id="totalEmployees">0</span> Minisers</span>
              
              <!-- BOTÓN GHOST DE EVENTOS (CUMPLEAÑOS/ANIVERSARIOS) -->
              <button type="button" id="btnEventsIndicator" onclick="openEventsModal()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-app-brand dark:text-teal-400 bg-transparent hover:bg-app-brand/10 dark:hover:bg-teal-500/10 transition-colors cursor-pointer">
                  <i data-lucide="calendar-heart" class="w-4 h-4"></i> 
                  <span id="eventsButtonText">0 Eventos (Mes)</span>
              </button>
          </div>
      </div>

      <div id="seccionAlertas" class="hidden flex-col gap-2 bg-gradient-to-r from-teal-500/10 via-amber-500/10 to-rose-500/10 border border-transparent rounded-2xl p-4 shadow-sm backdrop-blur-sm">
          <div class="flex items-center gap-2 text-xs font-bold text-app-brand dark:text-teal-400 uppercase tracking-wider">
              <i data-lucide="bell-ring" class="w-4 h-4 animate-bounce"></i> Notificaciones del Día
          </div>
          <div id="listaAlertas" class="flex flex-col gap-1.5 pt-1 text-xs font-medium"></div>
      </div>

      <!-- BARRA DE HERRAMIENTAS (BÚSQUEDA Y FILTROS) -->
      <div class="flex flex-col gap-3 bg-app-card/40 dark:bg-darkapp-card/40 p-3 rounded-2xl shadow-sm border border-app-border/50 dark:border-darkapp-border/50">
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <div class="relative flex-1">
                  <i data-lucide="search" class="w-4 h-4 text-app-sub absolute left-3.5 top-3"></i>
                  <input type="text" id="inputBuscar" oninput="filtrarEmpleados()" placeholder="Buscar por nombre o número..." class="w-full pl-10 pr-4 py-2.5 text-xs rounded-xl input-ghost font-medium shadow-sm">
              </div>
              <button type="button" onclick="abrirModalEmpleado()" class="bg-transparent text-app-brand hover:bg-app-brand/10 dark:text-teal-400 dark:hover:bg-teal-500/10 font-semibold px-4 py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition-colors cursor-pointer">
                  <i data-lucide="user-plus" class="w-4 h-4"></i> Agregar Miniser
              </button>
          </div>
          
          <!-- FILTROS PERSONALIZADOS (GLASSMORPHISM) -->
          <div class="grid grid-cols-2 gap-3">
              <!-- Dropdown Puesto -->
              <div class="relative">
                  <button type="button" onclick="toggleCustomDropdown(event, 'dropdownPuesto')" class="w-full h-10 flex items-center justify-between px-3 rounded-xl input-ghost text-xs font-semibold text-app-sub hover:text-app-title transition-colors">
                      <div class="flex items-center gap-2 truncate">
                          <i data-lucide="briefcase" class="w-3.5 h-3.5 shrink-0"></i>
                          <span id="labelPuesto" class="truncate">Todos los puestos</span>
                      </div>
                      <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0"></i>
                  </button>
                  <div id="dropdownPuesto" class="hidden absolute top-full left-0 mt-1 w-full bg-app-card/95 dark:bg-darkapp-card/95 backdrop-blur-xl shadow-xl border border-white/20 dark:border-slate-700/30 rounded-xl z-[999] py-1 flex flex-col">
                      <button type="button" onclick="selectFilterOption('puesto', '', 'Todos los puestos')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Todos los puestos</button>
                      <button type="button" onclick="selectFilterOption('puesto', 'Gerente', 'Gerente')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Gerente</button>
                      <button type="button" onclick="selectFilterOption('puesto', 'Subgerente', 'Subgerente')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Subgerente</button>
                      <button type="button" onclick="selectFilterOption('puesto', 'Promotor', 'Promotor')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Promotor</button>
                      <button type="button" onclick="selectFilterOption('puesto', 'Promotor de temporada', 'Promotor de temporada')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Promotor de temporada</button>
                  </div>
              </div>

              <!-- Dropdown Ordenar -->
              <div class="relative">
                  <button type="button" onclick="toggleCustomDropdown(event, 'dropdownOrden')" class="w-full h-10 flex items-center justify-between px-3 rounded-xl input-ghost text-xs font-semibold text-app-sub hover:text-app-title transition-colors">
                      <div class="flex items-center gap-2 truncate">
                          <i data-lucide="arrow-down-up" class="w-3.5 h-3.5 shrink-0"></i>
                          <span id="labelOrden" class="truncate">Nombre (A-Z)</span>
                      </div>
                      <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0"></i>
                  </button>
                  <div id="dropdownOrden" class="hidden absolute top-full left-0 mt-1 w-full bg-app-card/95 dark:bg-darkapp-card/95 backdrop-blur-xl shadow-xl border border-white/20 dark:border-slate-700/30 rounded-xl z-[999] py-1 flex flex-col">
                      <button type="button" onclick="selectFilterOption('orden', 'name_asc', 'Nombre (A-Z)')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Nombre (A-Z)</button>
                      <button type="button" onclick="selectFilterOption('orden', 'name_desc', 'Nombre (Z-A)')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Nombre (Z-A)</button>
                      <button type="button" onclick="selectFilterOption('orden', 'date_desc', 'Ingreso reciente')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Ingreso reciente</button>
                      <button type="button" onclick="selectFilterOption('orden', 'date_asc', 'Ingreso antiguo')" class="px-3 py-2 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 transition-colors">Ingreso antiguo</button>
                  </div>
              </div>
          </div>
      </div>

      <div id="gridEmpleados" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2"></div>

      <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
          <div class="w-16 h-16 rounded-2xl bg-app-card/50 dark:bg-darkapp-card/50 border border-transparent flex items-center justify-center text-app-sub mb-3 shadow-sm">
              <i data-lucide="users" class="w-8 h-8 opacity-40"></i>
          </div>
          <p id="emptyStateTitle" class="text-sm font-bold text-app-title dark:text-darkapp-title">No hay Minisers registrados</p>
          <p id="emptyStateSubtitle" class="text-xs text-app-sub mt-1">Comienza agregando un nuevo Miniser a la agenda.</p>
      </div>
    </div>
  </div>    

  <!-- MODAL: EVENTOS DEL MES (CUMPLEAÑOS Y ANIVERSARIOS) -->
  <div id="modalEvents" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[10000] flex items-center justify-center p-4 hidden">
      <div class="glass-modal border border-white/20 dark:border-slate-700/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[80vh] flex flex-col">
          <div class="flex items-center justify-between pb-2 border-b border-app-border/50 dark:border-darkapp-border/50 shrink-0">
              <h3 class="text-base font-bold text-app-title dark:text-darkapp-title flex items-center gap-2">
                  <i data-lucide="party-popper" class="w-5 h-5 text-amber-500"></i>
                  Eventos del Mes
              </h3>
              <button type="button" onclick="closeEventsModal()" class="text-app-sub hover:text-app-title cursor-pointer text-2xl leading-none">&times;</button>
          </div>
          <div id="eventsListContainer" class="overflow-y-auto flex-1 space-y-2 pr-1">
              <!-- Inyectado dinámicamente -->
          </div>
      </div>
  </div>

  <!-- MODAL CREAR / EDITAR EMPLEADO -->
  <div class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[10000] flex items-center justify-center p-4 hidden" id="modalEmpleado">  
    <div class="glass-modal border border-white/20 dark:border-slate-700/30 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">  
      <div class="flex items-center justify-between pb-2 border-b border-app-border/50 dark:border-darkapp-border/50">  
        <h3 id="modalTitulo" class="text-base font-bold text-app-title dark:text-darkapp-title">Nuevo Miniser</h3>  
        <button type="button" onclick="cerrarModalEmpleado()" class="text-app-sub hover:text-app-title cursor-pointer text-2xl leading-none">&times;</button>  
      </div>  

      <form id="formEmpleado" onsubmit="guardarEmpleado(event)" class="space-y-3 text-xs">  
        <input type="hidden" id="empId">
        <input type="hidden" id="empIdOriginal">
        <input type="hidden" id="empFotoUrl">

        <div class="flex flex-col items-center gap-2 py-2">
            <div class="relative w-24 h-24 rounded-full overflow-hidden bg-app-bg dark:bg-slate-800 border-2 border-transparent flex items-center justify-center shadow-inner">
                <img id="imgPreview" src="" onerror="this.classList.add('hidden'); document.getElementById('imgPlaceholder').classList.remove('hidden');" class="w-full h-full object-cover hidden">
                <i data-lucide="user" id="imgPlaceholder" class="w-8 h-8 text-app-sub"></i>
            </div>
            <div class="flex items-center gap-2">
                <label class="px-3 py-1.5 bg-transparent text-app-brand hover:bg-app-brand/10 dark:text-teal-400 dark:hover:bg-teal-500/10 rounded-lg font-semibold cursor-pointer transition-colors flex items-center gap-1.5">
                    <i data-lucide="image" class="w-3.5 h-3.5"></i> Galería
                    <input type="file" id="inputFoto" accept="image/*" onchange="seleccionarArchivoFoto(this)" class="hidden">
                </label>
                <button type="button" onclick="abrirCamaraModal()" class="px-3 py-1.5 bg-transparent text-app-brand hover:bg-app-brand/10 dark:text-teal-400 dark:hover:bg-teal-500/10 rounded-lg font-semibold cursor-pointer transition-colors flex items-center gap-1.5">
                    <i data-lucide="camera" class="w-3.5 h-3.5"></i> Cámara
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="space-y-1"><label class="font-semibold text-app-sub">Nombre Completo *</label><input type="text" id="empNombre" required class="w-full px-3 py-2 rounded-xl input-ghost font-semibold capitalize"></div>
            <div class="space-y-1"><label class="font-semibold text-app-sub">Núm. de Miniser *</label><input type="text" id="empNumero" required class="w-full px-3 py-2 rounded-xl input-ghost font-semibold"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="space-y-1"><label class="font-semibold text-app-sub">Correo Electrónico</label><input type="email" id="empCorreo" class="w-full px-3 py-2 rounded-xl input-ghost font-semibold"></div>
            <div class="space-y-1"><label class="font-semibold text-app-sub">Número Celular</label><input type="tel" id="empTelefono" class="w-full px-3 py-2 rounded-xl input-ghost font-semibold" placeholder="10 dígitos"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="space-y-1"><label class="font-semibold text-app-sub">Fecha de Nacimiento *</label><input type="date" id="empNacimiento" required class="w-full px-3 py-2 rounded-xl input-ghost font-semibold"></div>
            <div class="space-y-1"><label class="font-semibold text-app-sub">Fecha de Ingreso *</label><input type="date" id="empIngreso" required onchange="calcularAntiguedadPreview()" class="w-full px-3 py-2 rounded-xl input-ghost font-semibold"></div>
        </div>

        <div class="space-y-1">
            <label class="font-semibold text-app-sub">Antigüedad Calculada</label>
            <input type="text" id="empAntiguedadPreview" readonly value="-- años" class="w-full px-3 py-2 rounded-xl input-ghost font-bold text-app-brand bg-app-card/30 dark:bg-slate-800/30">
        </div>

        <div class="space-y-1 relative">
            <label class="font-semibold text-app-sub">Puesto en la Empresa *</label>
            <div class="relative">
                <button type="button" id="btnSelectPuesto" onclick="togglePuestoDropdown(event)" class="w-full px-3 py-2 rounded-xl input-ghost font-semibold text-left flex items-center justify-between cursor-pointer">
                    <span id="selectedPuestoLabel">Seleccione un puesto...</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-app-sub"></i>
                </button>
                <input type="hidden" id="empPuestoSelect" required>
                <div id="puestoDropdownList" class="hidden absolute left-0 right-0 bottom-full mb-1 bg-app-card/95 dark:bg-darkapp-card/95 backdrop-blur-md shadow-xl border border-white/20 dark:border-slate-700/30 rounded-xl z-[999] py-1 flex flex-col">
                    <button type="button" onclick="seleccionarPuesto('Gerente')" class="px-4 py-2.5 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 cursor-pointer">Gerente</button>
                    <button type="button" onclick="seleccionarPuesto('Subgerente')" class="px-4 py-2.5 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 cursor-pointer">Subgerente</button>
                    <button type="button" onclick="seleccionarPuesto('Promotor')" class="px-4 py-2.5 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 cursor-pointer">Promotor</button>
                    <button type="button" onclick="seleccionarPuesto('Promotor de temporada')" class="px-4 py-2.5 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 cursor-pointer">Promotor de temporada</button>
                    <button type="button" onclick="seleccionarPuesto('Otro')" class="px-4 py-2.5 text-left text-xs font-semibold hover:bg-app-bg dark:hover:bg-slate-800 cursor-pointer text-app-brand">Otro</button>
                </div>
            </div>
        </div>

        <div id="divPuestoOtro" class="space-y-1 hidden">
            <label class="font-semibold text-app-sub">Especifique el Puesto *</label>
            <input type="text" id="empPuestoOtro" class="w-full px-3 py-2 rounded-xl input-ghost font-semibold">
        </div>

        <div class="pt-3 flex justify-end gap-2">
            <button type="button" onclick="cerrarModalEmpleado()" class="px-4 py-2 bg-transparent text-app-sub hover:text-app-title dark:text-darkapp-sub dark:hover:text-darkapp-title rounded-xl font-semibold hover:bg-app-bg/50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer">Cancelar</button>
            <button type="submit" id="btnGuardarEmpleado" class="px-5 py-2 bg-transparent text-app-brand hover:bg-app-brand/10 dark:text-teal-400 dark:hover:bg-teal-500/10 font-semibold rounded-xl transition-colors cursor-pointer">Guardar Miniser</button>
        </div>
      </form>

    const MINISERS_CACHE_DB = 'MinisersOfflineDB';
    const MINISERS_CACHE_STORE = 'cache';

    function openMinisersCacheDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(MINISERS_CACHE_DB, 1);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => resolve(req.result);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(MINISERS_CACHE_STORE)) {
                    db.createObjectStore(MINISERS_CACHE_STORE, { keyPath: 'key' });
                }
            };
        });
    }

    async function setMinisersCache(key, value) {
        try {
            const db = await openMinisersCacheDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(MINISERS_CACHE_STORE, 'readwrite');
                const req = tx.objectStore(MINISERS_CACHE_STORE).put({ key, value, updatedAt: Date.now() });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn('[Cache Minisers] Error guardando:', e);
        }
    }

    async function getMinisersCache(key) {
        try {
            const db = await openMinisersCacheDB();
            return await new Promise((resolve, reject) => {
                const tx = db.transaction(MINISERS_CACHE_STORE, 'readonly');
                const req = tx.objectStore(MINISERS_CACHE_STORE).get(key);
                req.onsuccess = () => resolve(req.result ? req.result.value : null);
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            return null;
        }
    }

    function comprimirImagenFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Error al leer imagen'));
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.onerror = () => reject(new Error('Imagen inválida'));
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 400;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob((blob) => {
                        if (!blob) return reject(new Error('No se pudo comprimir la imagen'));
                        resolve(new File([blob], "foto_comprimida.jpg", { type: "image/jpeg" }));
                    }, 'image/jpeg', 0.75);
                };
            };
        });
    }

    function calcularAniosAntiguedad(fechaIngreso) {
        const ingreso = parseLocalDate(fechaIngreso);
        if (!ingreso) return '0 meses';
        const hoy = new Date();
        let anos = hoy.getFullYear() - ingreso.getFullYear();
        const m = hoy.getMonth() - ingreso.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < ingreso.getDate())) anos--;
        const meses = (hoy.getFullYear() - ingreso.getFullYear()) * 12 + (hoy.getMonth() - ingreso.getMonth()) - (hoy.getDate() < ingreso.getDate() ? 1 : 0);
        if (anos < 1) return `${Math.max(0, meses)} meses`;
        return `${anos} año${anos > 1 ? 's' : ''}`;
    }

    function evaluarAlertasYNotificaciones(empleados) {
        const hoy = new Date();
        const mesHoy = hoy.getMonth() + 1;
        const diaHoy = hoy.getDate();
        const anioActual = hoy.getFullYear();
        const listaAlertas = document.getElementById('listaAlertas');
        const seccionAlertas = document.getElementById('seccionAlertas');
        const btnEventsIndicator = document.getElementById('btnEventsIndicator');
        
        listaAlertas.innerHTML = '';
        monthlyEvents = [];
        
        let alertasHoy = 0;
        let birthdaysMonth = 0;
        let anniversariesMonth = 0;
        let birthdaysToday = 0;
        let anniversariesToday = 0;

        const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        empleados.forEach(emp => {
            if (emp.nacimiento) {
                const partesNac = String(emp.nacimiento).split('-');
                if (partesNac.length === 3) {
                    const m = parseInt(partesNac[1], 10);
                    const d = parseInt(partesNac[2], 10);
                    
                    if (m === mesHoy) {
                        birthdaysMonth++;
                        monthlyEvents.push({ type: 'birthday', name: emp.nombre, day: d, monthName: monthNames[m-1] });

                        if (d === diaHoy) {
                            alertasHoy++;
                            birthdaysToday++;
                            const div = document.createElement('div');
                            div.className = "flex items-center gap-2 text-app-title dark:text-darkapp-title bg-white/60 dark:bg-slate-800/60 p-2 rounded-xl border border-transparent";
                            div.innerHTML = `<i data-lucide="cake" class="w-4 h-4 text-rose-500 shrink-0"></i> <span>¡Hoy es el <strong>cumpleaños</strong> de <strong>${escapeHtml(emp.nombre)}</strong>! 🎂</span>`;
                            listaAlertas.appendChild(div);
                        }
                    }
                }
            }

            if (emp.ingreso) {
                const partesIng = String(emp.ingreso).split('-');
                if (partesIng.length === 3) {
                    const anioIng = parseInt(partesIng[0], 10);
                    const m = parseInt(partesIng[1], 10);
                    const d = parseInt(partesIng[2], 10);

                    if (m === mesHoy && anioIng < anioActual) {
                        anniversariesMonth++;
                        const years = anioActual - anioIng;
                        monthlyEvents.push({ type: 'anniversary', name: emp.nombre, day: d, monthName: monthNames[m-1], years: years });

                        if (d === diaHoy) {
                            alertasHoy++;
                            anniversariesToday++;
                            const div = document.createElement('div');
                            div.className = "flex items-center gap-2 text-app-title dark:text-darkapp-title bg-white/60 dark:bg-slate-800/60 p-2 rounded-xl border border-transparent";
                            div.innerHTML = `<i data-lucide="award" class="w-4 h-4 text-amber-500 shrink-0"></i> <span>¡<strong>${escapeHtml(emp.nombre)}</strong> hoy cumple <strong>${years} año${years > 1 ? 's' : ''}</strong> en la empresa! 🏆</span>`;
                            listaAlertas.appendChild(div);
                        }
                    }
                }
            }
        });

        document.getElementById('totalEmployees').textContent = empleados.length;

        if (birthdaysMonth > 0 || anniversariesMonth > 0) {
            btnEventsIndicator.classList.remove('hidden');
            btnEventsIndicator.classList.add('flex');

            let textParts = [];
            if (birthdaysToday > 0) textParts.push(`${birthdaysToday} Cumpleaños (Hoy)`);
            else if (birthdaysMonth > 0) textParts.push(`${birthdaysMonth} Cumpleaños (Mes)`);

            if (anniversariesToday > 0) textParts.push(`${anniversariesToday} Aniversario(s) (Hoy)`);
            else if (anniversariesMonth > 0) textParts.push(`${anniversariesMonth} Aniversario(s) (Mes)`);

            document.getElementById('eventsButtonText').textContent = textParts.join(' / ');
        } else {
            btnEventsIndicator.classList.add('hidden');
            btnEventsIndicator.classList.remove('flex');
        }

        if (alertasHoy > 0) { 
            seccionAlertas.classList.remove('hidden'); 
            seccionAlertas.classList.add('flex'); 
        } else { 
            seccionAlertas.classList.remove('flex'); 
            seccionAlertas.classList.add('hidden'); 
        }
        lucide.createIcons({ root: seccionAlertas });
    }

            document.getElementById('modalTitulo').innerText = 'Editar Miniser';
            const { data: emp, error } = await supabaseClient.from('empleados').select('*').eq('id', Number(id)).single();
            if (emp && !error) {
                document.getElementById('empId').value = emp.id;
                document.getElementById('empIdOriginal').value = emp.numero_empleado;
                document.getElementById('empNombre').value = emp.nombre;
                document.getElementById('empNumero').value = emp.numero_empleado;
                document.getElementById('empCorreo').value = emp.correo || '';
                document.getElementById('empTelefono').value = emp.telefono || '';
                document.getElementById('empNacimiento').value = emp.nacimiento || '';
                document.getElementById('empIngreso').value = emp.ingreso;
                document.getElementById('empFotoUrl').value = emp.foto_url || '';
                calcularAntiguedadPreview();
                if (['Gerente', 'Subgerente', 'Promotor', 'Promotor de temporada'].includes(emp.puesto)) {
                    seleccionarPuesto(emp.puesto);
                } else {
                    seleccionarPuesto('Otro');
                    document.getElementById('empPuestoOtro').value = emp.puesto;
                }
                if (emp.foto_url) mostrarPreviewFoto(emp.foto_url);
            }
        }
        document.getElementById('modalEmpleado').classList.remove('hidden');
    }

    function cerrarModalEmpleado() { document.getElementById('modalEmpleado').classList.add('hidden'); }

    async function guardarEmpleado(event) {
        event.preventDefault();
        if (!navigator.onLine) {
            mostrarAlerta('Sin conexión a internet. Conéctate para guardar cambios.', true);
            return;
        }

        const btnGuardar = document.getElementById('btnGuardarEmpleado');
        const originalBtnText = btnGuardar.textContent;
        btnGuardar.disabled = true;
        btnGuardar.textContent = 'Guardando...';

        try {
            const idVal = document.getElementById('empId').value;
            const numeroIngresado = document.getElementById('empNumero').value.trim();
            const puestoSelect = document.getElementById('empPuestoSelect').value;
            const fechaNacimiento = document.getElementById('empNacimiento').value;
            const fechaIngreso = document.getElementById('empIngreso').value;

            const hoy = new Date();
            const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

            if (fechaNacimiento > hoyStr) { mostrarAlerta('La fecha de nacimiento no puede ser una fecha a futuro.', true); return; }
            if (fechaIngreso > hoyStr) { mostrarAlerta('La fecha de ingreso no puede ser una fecha a futuro.', true); return; }
            if (!puestoSelect) { mostrarAlerta('Por favor seleccione un puesto válido.', true); return; }

            const puestoFinal = puestoSelect === 'Otro' ? document.getElementById('empPuestoOtro').value.trim() : puestoSelect;

            const { data: existing, error: errCheck } = await supabaseClient.from('empleados').select('id, numero_empleado').eq('numero_empleado', numeroIngresado);
            if (!errCheck && existing) {
                const existe = existing.some(emp => !idVal || emp.id !== Number(idVal));
                if (existe) { mostrarAlerta('El número de Miniser ingresado ya existe.', true); return; }
            }

            let fotoUrlFinal = document.getElementById('empFotoUrl').value;
            if (archivoFotoSeleccionado) {
                try { fotoUrlFinal = await subirFotoASupabase(archivoFotoSeleccionado, numeroIngresado); }
                catch (err) { mostrarAlerta('Error al subir la imagen al bucket.', true); return; }
            }

            const empleadoObj = {
                nombre: document.getElementById('empNombre').value.trim(),
                numero_empleado: numeroIngresado,
                correo: document.getElementById('empCorreo').value.trim(),
                telefono: document.getElementById('empTelefono').value.trim(),
                nacimiento: fechaNacimiento,
                ingreso: fechaIngreso,
                puesto: puestoFinal,
                foto_url: fotoUrlFinal
            };

            let res = idVal
                ? await supabaseClient.from('empleados').update(empleadoObj).eq('id', Number(idVal))
                : await supabaseClient.from('empleados').insert([empleadoObj]);

            if (res.error) {
                mostrarAlerta('Error al guardar al Miniser en la Nube.', true);
            } else {
                cerrarModalEmpleado();
                await cargarEmpleados();
                mostrarAlerta(idVal ? 'Miniser actualizado correctamente' : 'Miniser registrado con éxito');
            }
        } finally {
            btnGuardar.disabled = false;
            btnGuardar.textContent = originalBtnText;
        }
    }

    async function eliminarEmpleado(id) {
        if (!navigator.onLine) {
            mostrarAlerta('Necesitas conexión a internet para eliminar registros.', true);
            return;
        }
        mostrarConfirmacion('¿Está seguro de eliminar a este Miniser?', async (confirmado) => {
            if (confirmado) {
                const { error } = await supabaseClient.from('empleados').delete().eq('id', Number(id));
                if (!error) { await cargarEmpleados(); mostrarAlerta('Miniser eliminado correctamente.'); }
                else { mostrarAlerta('Error al eliminar al Miniser.', true); }
            }
        });
    }

    async function cargarEmpleados() {
        let isUsingCache = false;

        if (navigator.onLine) {
            try {
                const { data: empleados, error } = await supabaseClient.from('empleados').select('*').order('nombre', { ascending: true });
                if (!error && Array.isArray(empleados)) {
                    allEmployees = empleados;
                    await setMinisersCache('empleados', empleados);
                } else {
                    const cached = await getMinisersCache('empleados');
                    if (cached) {
                        allEmployees = cached;
                        isUsingCache = true;
                    }
                }
            } catch (err) {
                console.warn('[Minisers] Error de red, cargando caché:', err);
                const cached = await getMinisersCache('empleados');
                if (cached) {
                    allEmployees = cached;
                    isUsingCache = true;
                }
            }
        } else {
            const cached = await getMinisersCache('empleados');
            allEmployees = cached || [];
            isUsingCache = true;
        }

        filtrarEmpleados();
        evaluarAlertasYNotificaciones(allEmployees);
        actualizarEstadoConexionUI(isUsingCache);
    }

    function filtrarEmpleados() {
        const query = document.getElementById('inputBuscar').value.toLowerCase();
        const puestoFilter = currentPuestoFilter;
        const sortBy = currentSortBy;

        let lista = allEmployees.filter(emp => {
            const matchQuery = emp.nombre.toLowerCase().includes(query) || 
                               String(emp.numero_empleado).toLowerCase().includes(query) || 
                               (emp.puesto || '').toLowerCase().includes(query);
            const matchPuesto = !puestoFilter || emp.puesto === puestoFilter;
            return matchQuery && matchPuesto;
        });

        lista.sort((a, b) => {
            if (sortBy === 'name_asc') return a.nombre.localeCompare(b.nombre);
            if (sortBy === 'name_desc') return b.nombre.localeCompare(a.nombre);
            if (sortBy === 'date_desc') return (parseLocalDate(b.ingreso)?.getTime() || 0) - (parseLocalDate(a.ingreso)?.getTime() || 0);
            if (sortBy === 'date_asc') return (parseLocalDate(a.ingreso)?.getTime() || 0) - (parseLocalDate(b.ingreso)?.getTime() || 0);
            return 0;
        });

        renderizarAgenda(lista);
    }

    function toggleCard(cardElement, event) {
        if (event && event.target.closest('button')) return;
        const details = cardElement.querySelector('.card-details');
        const chevron = cardElement.querySelector('.card-chevron');
        const isHidden = details.classList.contains('hidden');
        if (isHidden) { details.classList.remove('hidden'); if (chevron) chevron.style.transform = 'rotate(180deg)'; }
        else { details.classList.add('hidden'); if (chevron) chevron.style.transform = 'rotate(0deg)'; }
    }

    function getAvatarHTML(emp) {
        const initials = emp.nombre.split(' ').filter(Boolean).map(n => n[0]).slice(0, 2).join('').toUpperCase();
        const colorIndex = emp.nombre.length % AVATAR_COLORS.length;
        const bgColor = AVATAR_COLORS[colorIndex];
        const fallbackDiv = `<div class="w-full h-full ${bgColor} text-white flex items-center justify-center font-bold text-lg avatar-initials rounded-full">${escapeHtml(initials)}</div>`;

        if (emp.foto_url) {
            return `<img src="${escapeHtml(emp.foto_url)}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'w-full h-full ${bgColor} text-white flex items-center justify-center font-bold text-lg avatar-initials rounded-full', textContent:'${escapeHtml(initials)}'}));" class="w-full h-full object-cover">`;
        }
        return fallbackDiv;
    }

    function renderizarAgenda(empleados) {
        const grid = document.getElementById('gridEmpleados');
        const emptyState = document.getElementById('emptyState');
        const emptyTitle = document.getElementById('emptyStateTitle');
        const emptySub = document.getElementById('emptyStateSubtitle');
        grid.innerHTML = '';

        if (empleados.length === 0) {
            emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
            if (!navigator.onLine && allEmployees.length === 0) {
                emptyTitle.textContent = 'Sin conexión y sin caché local';
                emptySub.textContent = 'Conéctate a internet para cargar la agenda de Minisers.';
            } else {
                emptyTitle.textContent = 'No hay Minisers registrados';
                emptySub.textContent = 'Comienza agregando un nuevo Miniser a la agenda.';
            }
            return;
        }
        emptyState.classList.remove('flex'); emptyState.classList.add('hidden');

        empleados.forEach(emp => {
            const antiguedad = calcularAniosAntiguedad(emp.ingreso);
            const card = document.createElement('div');
            card.className = "bg-app-card dark:bg-darkapp-card border-none rounded-2xl p-4 flex flex-col shadow-[0_2px_10px_rgba(0,0,0,0.02)] gap-3 cursor-pointer transition-all fade-in";
            card.setAttribute('onclick', 'toggleCard(this, event)');
            
            const safeName = escapeHtml(emp.nombre);
            const safePuesto = escapeHtml(emp.puesto);
            const safeNumero = escapeHtml(emp.numero_empleado);
            const safeCorreo = escapeHtml(emp.correo || 'No registrado');
            const safeTelefono = escapeHtml(emp.telefono || 'No registrado');
            const safeIngreso = escapeHtml(emp.ingreso);
            
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-14 h-14 rounded-full overflow-hidden bg-app-bg dark:bg-slate-800 border border-transparent flex items-center justify-center shrink-0 shadow-sm">
                            ${getAvatarHTML(emp)}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-sm truncate text-app-title dark:text-darkapp-title">${safeName}</h4>
                            <p class="text-[11px] text-app-brand font-semibold truncate">${safePuesto}</p>
                            <p class="text-[10px] text-app-sub mt-0.5">#: <span class="font-bold text-app-title dark:text-darkapp-title">${safeNumero}</span></p>
                        </div>
                    </div>
                    <div class="p-1 text-app-sub transition-transform duration-200 card-chevron shrink-0">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>

                <div class="card-details hidden space-y-3 pt-2 border-t border-app-border/50 dark:border-darkapp-border/50">
                    <div class="space-y-1 text-xs">
                        <div class="flex items-center gap-2 text-app-sub"><i data-lucide="mail" class="w-3.5 h-3.5"></i> <span class="truncate">${safeCorreo}</span></div>
                        <div class="flex items-center gap-2 text-app-sub"><i data-lucide="phone" class="w-3.5 h-3.5"></i> <span>${safeTelefono}</span></div>
                        <div class="flex items-center gap-2 text-app-sub"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> <span>Ingreso: ${safeIngreso} (${escapeHtml(antiguedad)})</span></div>
                    </div>
                    <div class="flex items-center justify-end gap-1 pt-1">
                        <button type="button" data-action="share" data-id="${emp.id}" class="p-2 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 rounded-lg transition-colors cursor-pointer" title="Compartir WhatsApp">
                            <i data-lucide="share-2" class="w-4 h-4"></i>
                        </button>
                        <button type="button" data-action="edit" data-id="${emp.id}" class="p-2 text-app-sub hover:text-app-brand rounded-lg transition-colors cursor-pointer" title="Editar">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button type="button" data-action="delete" data-id="${emp.id}" class="p-2 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-lg transition-colors cursor-pointer" title="Eliminar">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
        lucide.createIcons();

        if (!grid.dataset.listenerAttached) {
            grid.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const action = btn.getAttribute('data-action');
                const id = btn.getAttribute('data-id');
                if (action === 'share') {
                    const emp = allEmployees.find(x => x.id == id);
                    if (emp) compartirEmpleadoWA(emp);
                } else if (action === 'edit') {
                    abrirModalEmpleado(id);
                } else if (action === 'delete') {
                    eliminarEmpleado(id);
                }
            });
            grid.dataset.listenerAttached = 'true';
        }
    }

    function compartirEmpleadoWA(emp) {
        const texto = `👤 *Ficha de Miniser*\n\n` +
                      `• *Nombre completo:* ${emp.nombre}\n` +
                      `• *Puesto:* ${emp.puesto}\n` +
                      `• *Número de Miniser:* ${emp.numero_empleado}\n` +
                      `• *Número celular:* ${emp.telefono || 'No registrado'}\n` +
                      `• *Correo electrónico:* ${emp.correo || 'No registrado'}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank', 'noopener,noreferrer');
    }

    async function compartirWhatsappGeneral() {
        if (!allEmployees || allEmployees.length === 0) { mostrarAlerta("No hay Minisers para compartir.", true); return; }
        let texto = `📋 *Agenda General de Minisers*\nTotal registrados: ${allEmployees.length}\n\n`;
        allEmployees.forEach((emp, i) => {
            texto += `*${i+1}. ${emp.nombre}*\n   • Puesto: ${emp.puesto}\n   • Núm. Miniser: ${emp.numero_empleado}\n   • Celular: ${emp.telefono || 'N/A'}\n   • Correo: ${emp.correo || 'N/A'}\n\n`;
        });
        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank', 'noopener,noreferrer');
    }

    async function exportarExcelGeneral() {
        if (!allEmployees || allEmployees.length === 0) { mostrarAlerta("No hay datos para exportar.", true); return; }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + "Número de Miniser,Nombre Completo,Puesto,Celular,Correo Electrónico,Fecha Nacimiento,Fecha Ingreso\n";
        allEmployees.forEach(emp => {
            csvContent += `"${emp.numero_empleado}","${emp.nombre}","${emp.puesto}","${emp.telefono || ''}","${emp.correo || ''}","${emp.nacimiento || ''}","${emp.ingreso}"\n`;
        });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", "agenda_minisers_miniser.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function iniciarSuscripcionRealtime() {
        if (channelInstance || !navigator.onLine) return;
        channelInstance = supabaseClient
            .channel('cambios-empleados-miniser')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'empleados' }, () => cargarEmpleados())
            .subscribe();
    }

    window.addEventListener('online', () => {
        cargarEmpleados();
        iniciarSuscripcionRealtime();
    });
    window.addEventListener('offline', () => actualizarEstadoConexionUI(true));

    window.addEventListener('DOMContentLoaded', async () => {
        initServiceWorker();
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.replace('../index.html'); return; }
        } catch (e) {
            if (navigator.onLine) { window.location.replace('../index.html'); return; }
        }

        inicializarFechasMaximas();
        await cargarEmpleados();
        iniciarSuscripcionRealtime();
        lucide.createIcons();
    });
  </script>  
</body>  
</html>
